[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-sitemap"
  # unlisted collaborator pages stay out of the sitemap
  [plugins.inputs]
    exclude = ["**/share/**"]

[[headers]]
  for = "/share/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
